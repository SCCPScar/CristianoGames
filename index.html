<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="CrisTetris: Tetris e Zuma em um único app." />
  <meta name="theme-color" content="#121212" />
  <title>CrisTetris</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #121212;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      width: 100%;
      height: 100%;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #121212;
      color: #f5f5f5;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    #rotate-hint .icon { font-size: 56px; margin-bottom: 16px; }
    @media (orientation: portrait) {
      #rotate-hint { display: flex; }
      #game { display: none; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint">
    <div class="icon">↻</div>
    <div>Gire o celular na horizontal para jogar</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
